<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>InJoy 登入連線</title>
</head>
<body>
<p>InJoy 營養俱樂部安全登入連線 v1.3.1</p>
<p>更新：2026/10/15 11:43（台灣時間）</p>

<script>
'use strict';

const bridgeConfig = <?!= configJson ?>;
const seen = new Set();
const ancestors = new Set();

let client = null;
let readyCount = 0;
let readyTimer = null;

// 通知祖先視窗，僅允許指定的前端來源接收。
let ancestor = window.parent;

for (let depth = 0; depth < 12; depth++) {
  if (
    !ancestor ||
    ancestor === window ||
    ancestors.has(ancestor)
  ) break;

  ancestors.add(ancestor);

  const next = ancestor.parent;
  if (next === ancestor) break;

  ancestor = next;
}

function send(message) {
  const payload = Object.assign(
    { nonce: bridgeConfig.bridgeNonce },
    message
  );

  const targets = client
    ? [client]
    : Array.from(ancestors);

  for (const target of targets) {
    target.postMessage(
      payload,
      bridgeConfig.allowedOrigin
    );
  }
}

function validSession(token) {
  return (
    typeof token === 'string' &&
    /^[a-f0-9]{64}$/.test(token)
  );
}

function announceReady() {
  if (client || readyCount >= 60) {
    clearInterval(readyTimer);
    return;
  }

  readyCount++;

  send({
    type: 'INJOY_LOGIN_READY',
    bridgeVersion: '1.3.1',
    actions: [
      'login',
      'whoami',
      'logout',
      'coachApply',
      'coachApplications',
      'coachReview',
      'teamDirectory',
      'teamGrid'
    ]
  });
}

window.addEventListener('message', function (e) {
  const m = e.data;

  if (
    e.origin !== bridgeConfig.allowedOrigin ||
    !ancestors.has(e.source) ||
    (client && e.source !== client) ||
    !m ||
    m.type !== 'INJOY_LOGIN_REQUEST' ||
    m.nonce !== bridgeConfig.bridgeNonce ||
    typeof m.requestId !== 'string' ||
    !/^[a-f0-9]{32}$/.test(m.requestId)
  ) return;

  if (seen.has(m.requestId)) return;

  client = e.source;
  clearInterval(readyTimer);

  if (seen.size >= 200) {
    send({
      type: 'INJOY_LOGIN_RESPONSE',
      requestId: m.requestId,
      result: {
        ok: false,
        error: {
          code: 'BRIDGE_LIMIT',
          message: '請重新整理登入頁。'
        }
      }
    });
    return;
  }

  seen.add(m.requestId);

  const result = function (r) {
    send({
      type: 'INJOY_LOGIN_RESPONSE',
      requestId: m.requestId,
      result: r
    });
  };

  const fail = function () {
    result({
      ok: false,
      error: {
        code: 'BRIDGE_SERVICE_ERROR',
        message: '後端連線暫時無法完成。'
      }
    });
  };

  const runner = google.script.run
    .withSuccessHandler(result)
    .withFailureHandler(fail);

  if (
    m.action === 'login' &&
    typeof m.idToken === 'string' &&
    m.idToken.length >= 100 &&
    m.idToken.length <= 12000
  ) {
    runner.injoyLiffLogin(m.idToken);

  } else if (
    m.action === 'whoami' &&
    validSession(m.sessionToken)
  ) {
    runner.injoyLiffWhoAmI(m.sessionToken);

  } else if (
    m.action === 'logout' &&
    validSession(m.sessionToken)
  ) {
    runner.injoyLiffLogout(m.sessionToken);

  } else if (
    m.action === 'coachApply' &&
    validSession(m.sessionToken) &&
    typeof m.ticketId === 'string' &&
    typeof m.ticketToken === 'string'
  ) {
    runner.injoyCoachApply(
      m.sessionToken,
      m.ticketId,
      m.ticketToken
    );

  } else if (
    m.action === 'coachApplications' &&
    validSession(m.sessionToken) &&
    Number.isSafeInteger(m.offset ?? 0) &&
    (m.offset ?? 0) >= 0
  ) {
    runner.injoyCoachListApplications(
      m.sessionToken,
      m.offset ?? 0
    );

  } else if (
    m.action === 'coachReview' &&
    validSession(m.sessionToken) &&
    typeof m.applicationId === 'string' &&
    ['approve', 'reject'].includes(m.decision) &&
    Number.isSafeInteger(m.expectedRevision) &&
    m.expectedRevision >= 1
  ) {
    runner.injoyCoachReviewApplication(
      m.sessionToken,
      m.applicationId,
      m.decision,
      m.expectedRevision
    );

  } else if (
    m.action === 'teamDirectory' &&
    validSession(m.sessionToken)
  ) {
    runner.injoyGetTeamDirectory(
      m.sessionToken
    );

  } else if (
    m.action === 'teamGrid' &&
    validSession(m.sessionToken) &&
    typeof m.teamLapId === 'string' &&
    m.teamLapId.length > 0 &&
    m.teamLapId.length <= 128
  ) {
    runner.injoyGetTeamGrid(
      m.sessionToken,
      m.teamLapId
    );

  } else {
    result({
      ok: false,
      error: {
        code: 'INVALID_BRIDGE_ACTION',
        message:
          '橋接版本或操作不相容，請更新既有Apps Script部署後重新開啟頁面。'
      }
    });
  }
});

readyTimer = setInterval(announceReady, 500);
announceReady();
</script>
</body>
</html>
